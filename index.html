<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><title>Cash Management</title><link rel="stylesheet" href="./style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">CASH MANAGEMENT</div><h1>Мой бюджет</h1></div><button class="icon" id="closeBtn">×</button></header>
<section class="hero"><div class="label">Доступно</div><div class="balance" id="balance">— ₽</div><div class="period" id="period">Финансовый месяц 20 → 19</div></section>
<section class="stats"><article><span>Сегодня</span><strong id="today">— ₽</strong></article><article><span>Лимит сегодня</span><strong id="limit">— ₽</strong></article><article><span>Потрачено</span><strong id="spent">— ₽</strong></article><article><span>Накопления</span><strong id="savings">— ₽</strong></article></section>
<section class="panel"><div class="panel-title">Быстрые действия</div><div class="grid"><button data-action="expense">➕<span>Расход</span></button><button data-action="income">💰<span>Доход</span></button><button data-action="save">🔒<span>Отложить</span></button><button data-action="analytics">📊<span>Аналитика</span></button><button data-action="today">📆<span>Сегодня</span></button><button data-action="report">📄<span>Отчёт</span></button></div></section>
<section class="panel"><div class="panel-title">Добавить расход</div><div class="input-row"><input id="amount" inputmode="decimal" placeholder="Сумма"><input id="description" placeholder="Например: продукты"></div><button class="primary" id="sendExpense">Добавить расход</button></section>
<div class="hint" id="hint">Подключение…</div></main><script src="./config.js"></script><script src="./app.js"></script></body></html>
