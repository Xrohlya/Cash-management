<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Мой бюджет</title>
  <link rel="stylesheet" href="/static/design.css?v=20261001-3">
  <link rel="stylesheet" href="/static/pets/design.css?v=20261002-2">
  <link rel="stylesheet" href="/static/pets/appearance.css?v=20261002-2">
  <link rel="stylesheet" href="/static/pets/life.css?v=20261002-3">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="profile-header">
      <span class="avatar" id="avatar">—</span>
      <div>
        <p class="eyebrow" id="today-date">Сегодня</p>
        <h1 id="greeting">Мой бюджет</h1>
        <p class="period-line" id="period">Финансовый месяц</p>
      </div>
    </div>
    <button class="icon-button" id="refresh" type="button" aria-label="Обновить" title="Обновить">↻</button>
  </header>

  <nav class="tabbar" role="tablist" aria-label="Разделы">
    <button class="active" id="nav-budget" type="button" role="tab" data-tab-target="budget" aria-controls="tab-budget" aria-selected="true"><i data-lucide="wallet" aria-hidden="true"></i><span>Бюджет</span></button>
    <button id="nav-expenses" type="button" role="tab" data-tab-target="expenses" aria-controls="tab-expenses" aria-selected="false"><i data-lucide="arrow-left-right" aria-hidden="true"></i><span>Операции</span></button>
    <button id="nav-plans" type="button" role="tab" data-tab-target="plans" aria-controls="tab-plans" aria-selected="false"><i data-lucide="calendar-days" aria-hidden="true"></i><span>Планы</span></button>
    <button id="nav-settings" type="button" role="tab" data-tab-target="settings" aria-controls="tab-settings" aria-selected="false"><i data-lucide="settings-2" aria-hidden="true"></i><span>Настройки</span></button>
    <button id="nav-pets" type="button" role="tab" data-tab-target="pets" aria-controls="tab-pets" aria-selected="false"><i data-lucide="paw-print" aria-hidden="true"></i><span>Мой мир</span></button>
  </nav>

  <main>
$budget
$operations
$plans
$settings
$pets
  </main>

  <button class="quick-add" id="quick-add" type="button" aria-label="Добавить операцию" title="Добавить операцию" hidden>+</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  $dialogs
  <div class="blocking-message" id="blocking-message" hidden>
    <h2>Откройте приложение из Telegram</h2>
    <p>Авторизация доступна через кнопку меню вашего бота.</p>
  </div>
  <script src="/static/app.js?v=20261002-3" type="module"></script>
</body>
</html>
