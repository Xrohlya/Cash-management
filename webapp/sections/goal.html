<section class="goal-section">
        <div class="section-heading">
          <h2>Финансовая цель</h2>
          <button class="text-button" id="clear-goal" type="button" hidden>Удалить</button>
        </div>
        <div id="goal-summary" class="goal-summary empty-goal">Цель пока не задана</div>
        <form id="goal-form" class="goal-form">
          <label><span>Сумма цели</span><input id="goal-target" type="number" min="1" step="1" inputmode="decimal" required></label>
          <label><span>Срок</span><input id="goal-date" type="date" required></label>
          <button class="secondary" type="submit">Сохранить цель</button>
        </form>
      </section>
